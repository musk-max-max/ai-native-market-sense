[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sense-ingest"
version = "0.1.0"
description = "数据接入与调度：数据源端口 + 适配层 + raw 落库 + 增量/回补（A1 写域）"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

# 数据源 SDK 不进核心依赖：每个适配器把自己需要的 SDK 登记在自己的
# adapters/<adapter>/requirements.txt 里，核心包与业务层不得依赖任何数据源 SDK。
[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# PyYAML 无官方 stubs；配置读取是薄封装，按无类型处理。
[[tool.mypy.overrides]]
module = ["yaml", "akshare"]
ignore_missing_imports = true
