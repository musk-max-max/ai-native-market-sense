openapi: 3.1.0

info:
  title: market-sense-h5 · market（行情域 P0）
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    P0 行情域契约（个股页竖切片，决策 #8）。域内只含 instrument / quote / bars 三个资源。
    来源与时效字段由 shared ResponseMeta 强制携带：source（含 as_of/staleness_ms）、data_entitlement；
    价格类响应额外 required adjustment（复权口径）与 disclaimer（免责元数据）。
    数据口径：不做盘中实时（C2=A）；trade_date 为快照所属交易日，as_of 为数据市场时点。
    错误响应统一引用 shared Problem。

servers:
  - url: https://api.market-sense.invalid
    description: 占位域名（RFC 2606 .invalid），由 A13 在部署环境替换；路径含 /v1（决策 #1）

security: []  # 公开只读；数据授权与限流仍由服务端统一判定（决策 #5）

tags:
  - name: instrument
    description: 证券基础信息（P0 仅 A 股）
  - name: quote
    description: 最新行情快照
  - name: bars
    description: 历史 K 线（日线，含复权口径）

paths:

  /v1/instruments/{instrument_id}:
    get:
      operationId: getInstrument
      tags: [instrument]
      summary: 证券基础信息
      description: 返回单只证券的 canonical 基础信息。404 表示标识格式合法但不存在/未收录。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: 证券信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'

  /v1/instruments/{instrument_id}/quote:
    get:
      operationId: getInstrumentQuote
      tags: [quote]
      summary: 最新行情快照
      description: |
        返回最近一次成功快照（C2=A：不做盘中实时）。停牌/尚未开盘时价格字段允许 null，禁止用 0 冒充。
        数据源不可用时按 A3 规则返回最近成功快照（as_of 为快照时点），staleness_ms 交由前端标注 stale。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: 行情快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'

  /v1/instruments/{instrument_id}/bars:
    get:
      operationId: listInstrumentBars
      tags: [bars]
      summary: 历史日线（按复权口径）
      description: |
        按时间升序返回日线。adjustment 缺省 none（不复权，H4 主口径）；
        响应 data.adjustment 与 meta.adjustment 回显实际生效口径，用于前端标注与契约测试断言。
        区间边界：from/to 含端点；to 缺省为最近交易日。停牌日不合成 K 线（无 bar），不得用 0 填充。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
        - name: adjustment
          in: query
          required: false
          description: 复权口径；缺省 none（不复权）。
          schema:
            $ref: '../shared/openapi.yaml#/components/schemas/AdjType'
            default: none
        - name: from
          in: query
          required: false
          description: 起始交易日（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束交易日（含），格式 YYYY-MM-DD；缺省为最近交易日。
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: 返回条数上限（1–500），默认 120。数据不足时按实际返回，has_more 指示是否还有更早数据。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 120
      responses:
        '200':
          description: 日线序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarsResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'

components:
  schemas:

    Instrument:
      type: object
      description: 证券 canonical 基础信息（P0 仅 A 股）。
      required: [instrument_id, exchange, name, board, security_type, list_status]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        exchange:
          type: string
          enum: [SSE, SZSE, BSE]
          description: 交易所代码；新增交易所属破坏性变更（枚举加值），须 H2 签字。
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 证券简称。
        board:
          type: string
          enum: [main, gem, star, bse]
          description: 板块：main 主板 / gem 创业板 / star 科创板 / bse 北交所。H4 涨跌停与涨跌幅按板块规则计算。
        security_type:
          type: string
          enum: [stock, etf, index]
          description: 证券类型；P0 仅支持 stock，etf/index 为后续扩展预留（枚举加值属破坏性变更）。
        list_status:
          type: string
          enum: [listed, delisted, pre_listed]
          description: 上市状态。退市证券保留记录（不得删除），list_status=delisted。
        lot_size:
          type: integer
          minimum: 1
          description: 最小交易单位（股）。
        listed_at:
          type: string
          format: date
          description: 上市日期（如可得）。

    InstrumentResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Instrument'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          description: 强制携带 source（含 as_of/staleness_ms）与 data_entitlement；基础信息无复权口径。

    Quote:
      type: object
      description: |
        最新行情快照（C2=A：不做盘中实时）。价格单位：元；成交量：股；成交额：元。
        停牌/尚未开盘时 last_price、change、change_pct 允许 null，禁止用 0 冒充。
      required: [instrument_id, trade_date, last_price, prev_close, change, change_pct, volume, amount, suspended]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        trade_date:
          type: string
          format: date
          description: 快照所属交易日（A 股交易日，非自然日）。
        last_price:
          type: [number, "null"]
          description: 最新价（元），两位小数；无成交/停牌为 null。
        prev_close:
          type: [number, "null"]
          description: 前收盘价（元）。
        change:
          type: [number, "null"]
          description: 涨跌额（元），= last_price − prev_close；null 语义同 last_price。
        change_pct:
          type: [number, "null"]
          description: 涨跌幅（百分数数值，1.23 表示 +1.23%）；按板块规则计算（H4 D6）。
        open:
          type: [number, "null"]
          description: 开盘价（元）。
        high:
          type: [number, "null"]
          description: 最高价（元）。
        low:
          type: [number, "null"]
          description: 最低价（元）。
        volume:
          type: integer
          format: int64
          minimum: 0
          description: 成交量（股）。
        amount:
          type: number
          minimum: 0
          description: 成交额（元）。
        suspended:
          type: boolean
          description: 是否停牌。
        limit_status:
          type: string
          enum: [none, limit_up, limit_down]
          description: 涨跌停状态（按板块规则判定）；未知/不适用为 none。

    QuoteResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Quote'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [adjustment, disclaimer]
          description: |
            adjustment 为价格口径（快照不复权，恒为 none）；
            disclaimer 为免责元数据（H6 不可配、closable 恒 false）。

    Bar:
      type: object
      description: 单日 K 线（价格已按请求口径复权，单位：元；成交量：股；成交额：元）。
      required: [trade_date, open, high, low, close, volume, amount]
      additionalProperties: false
      properties:
        trade_date:
          type: string
          format: date
          description: 交易日。
        open:
          type: number
          description: 开盘价（元）。
        high:
          type: number
          description: 最高价（元）。
        low:
          type: number
          description: 最低价（元）。
        close:
          type: number
          description: 收盘价（元）。
        volume:
          type: integer
          format: int64
          minimum: 0
          description: 成交量（股）。
        amount:
          type: number
          minimum: 0
          description: 成交额（元）。

    BarsData:
      type: object
      required: [instrument_id, adjustment, bars, has_more]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        adjustment:
          $ref: '../shared/openapi.yaml#/components/schemas/AdjType'
        bars:
          type: array
          items:
            $ref: '#/components/schemas/Bar'
        has_more:
          type: boolean
          description: 是否还有更早的数据（limit 截断时 true）。

    BarsResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BarsData'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [adjustment, disclaimer]
          description: adjustment 必须与 data.adjustment 一致（契约测试 A11 断言）。
