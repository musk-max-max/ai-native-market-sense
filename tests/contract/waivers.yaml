# 破坏性契约变更豁免台账（A11 维护；不是免死金牌）
#
# 规则（tests/contract/contract_diff_lib.py 强制）：
# 1) 只有 oasdiff breaking（level=ERR）的变更需要登记；非破坏性变更（新增可选字段、新增错误码）
#    不需要登记，但会出现在 CI 报告的 observation 里；
# 2) 每条必须写清 ADR 编号、理由、H2 签字（approved_by 必须以 H2 开头）、到期日；
# 3) 到期未消解 = 红灯；waiver 匹配不到任何 breaking 变更 = 红灯（要求删除，防止台账变摆设）；
# 4) 首选的「合法」做法永远是在 ADR 里声明变更并原地完成 v1→v2 迁移，waiver 只是过渡期护栏。
# 5) H2 L45：response-optional-property-removed / response-optional-write-only-property-removed
#    由 contracts/oasdiff-severity.txt 提升为 err；oasdiff 报出的 ERR 同样按 waiver 语义登记。
