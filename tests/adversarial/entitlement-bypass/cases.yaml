# A19 越权用例集：主机层 / 隧道类（与 A9 对齐 schema，EXC-<SURFACE>-<NN>）
#
# 本文件是可读定义；机器执行入口为 ./run-host-layer.mjs（oracle 已编码为可判定式）。
# 设计原则：真实目标默认 BLOCKED，必须有 H5 书面授权 + A19_HOST_LAYER_APPROVED=1；
#           本地隔离栈自检不触碰 ECS，不绑定公网监听。
schema_version: "0.1"
owner: A19 (a19-red-team)
reviewer: A9 (security) / H5 (release sign-off)
cases:
  - case_id: EXC-HOST-01
    title: 主机层 → DB 直读，绕过 C 端授权门禁
    surface: HOST
    severity_expected: bypass
    preconditions:
      - 已授权目标（H5 书面批准 + A19_HOST_LAYER_APPROVED=1），或本地隔离栈自检
      - SSH 可达且可执行只读 SELECT（或本机 psql 连隔离库）
      - API 在 internal_eval 下 quote 预期 403
    steps:
      - "POST /v1/instruments/SSE:600519/quote（经 API loopback）记录 status/headers/body"
      - "只读 SQL：select count(*) from serving.serving_quote_latest"
      - "只读 SQL：select instrument_id, close, as_of from serving.serving_quote_latest order by instrument_id limit 1"
      - "只读 SQL（若存在）：select count(*) from audit.entitlement_events"
      - "读取运行容器 ENTITLEMENT_AUDIT / ENTITLEMENT_HOLD_CHECK / ENTITLEMENT_TIER"
    oracle: "api_quote_status == 403 AND db_quote_rows > 0 => BYPASS；api_quote_status == 403 AND db_quote_rows == 0 => BLOCKED；audit_event_count == null => audit_gap_status=INCOMPLETE（audit 子结论不得算 PASS）；其余 => INVALID"
    scope_note: "本地隔离栈自检结果只代表 fixture（market_sense_a19），不得表述为 ECS/生产结果"
    evidence_fields:
      - attempt_id
      - target
      - vantage
      - api_quote_status
      - api_body_sha256
      - db_quote_rows
      - db_sample
      - entitlement_audit_env
      - entitlement_hold_env
      - audit_event_count
      - audit_gap
    execution_note: "本地自检的 BYPASS 只作机制冒烟，不得进发布证据链；真实目标跑时必须带 audit_gap（0 行记 CONFIRMED_GAP，取不到记 INCOMPLETE）。"
    safety: "SQL 只读（count + 单行样本）；不写库、不启停容器、不 dump 全表"
    authorization: "真实目标：H5 书面授权 + A19_HOST_LAYER_APPROVED=1；当前 ECS 目标 status=blocked"
    owner: A19 (执行) / A9 (口径)
    status: design
  - case_id: EXC-TUNNEL-01
    title: SSH 隧道二次转发，第三人匿名到达内网入口
    surface: TUNNEL
    severity_expected: amplification
    preconditions:
      - 已授权目标 + 操作者 SSH 可达（H5 书面批准 + A19_HOST_LAYER_APPROVED=1）
      - 第二 vantage（同 LAN 另一台机器优先；否则同主机不同网络命名空间的 one-shot 容器，并显式标注非跨主机证据）
      - 本地隔离栈自检只验证 relay 逻辑，不得当作第三人可达证据
    steps:
      - "ssh -N -L <localPort>:127.0.0.1:3000 <user@target>"
      - "经 <localPort> 取 GET / 与 /v1/instruments/SSE:600519/quote，记录 status/headers/body"
      - "把 <localPort> 二次转发到 operator 的 0.0.0.0:<relayPort>（短窗口）"
      - "从第二 vantage 取同一页面/接口；记录源 IP、X-Forwarded-For、trustProxy 与服务端审计/身份字段"
      - "结束：kill relay 与 ssh，记录 0 监听"
    oracle: "second_vantage_status in {200,403} AND server_identity_distinguishable == false => AMPLIFICATION；second_vantage_status unreachable => BLOCKED；无法建立第二 vantage => INCOMPLETE"
    judgment_note: "不得写成「第三人拿到 403 所以安全」：403 只反映当前 tier；tier 合法切 c_end_display 后第三人即无身份读数值。结论措辞固定为「入口可达 + 无主体区分 = 再分发放大」，与 oracle 的 server_identity_distinguishable==false 对齐。同主机 relay 自连只算绑定存在性，绝不升级为 AMPLIFICATION。"
    vantage_note: "第二 vantage 优先用用户手机/平板（同 LAN、不持凭据、不经操作者主机，需用户/H5 同意，窗口短、结束记 0 监听）；无第二设备则 INCOMPLETE。macOS 本机无 docker，同主机 one-shot 容器 fallback 不可用。"
    relay_note: "真实目标上 relay 若绑 0.0.0.0，按「暴露面变更」对待：短窗口 + H5 知情 + 结束 kill + 记录 listeners，不留后台进程。"
    evidence_fields:
      - attempt_id
      - target
      - vantage_operator
      - vantage_second
      - tunnel_status
      - web_status
      - quote_status
      - quote_cache_control
      - relay_status
      - source_ip_seen
      - x_forwarded_for
      - trust_proxy
      - audit_event_count
      - server_identity_distinguishable
      - cleanup_listeners
    safety: "隧道仅在授权窗口内建立；结束 kill 并记录 0 监听；relay 不写入数据、不转发写请求"
    authorization: "真实目标：H5 书面授权 + A19_HOST_LAYER_APPROVED=1 + 第二 vantage；当前 status=blocked"
    owner: A19 (执行) / A9 (口径)
    status: design
