name: release-gate

# 11-12 放行验收（A11 的 tests/contract/CI_MOUNT.md §7；Lead L36 冻结）。
# 只在 release 前手动/打 tag 时跑，不进日常必过集。
# 退出码约定：0 通过 / 1 失败 / 2 缺配置 —— 2 必须按失败处理，不 skip。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 被测镜像 tag（release 候选）
        required: true
        type: string
      reason:
        description: 放行单号 / 变更说明（写入 job summary）
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.11.0"
  PNPM_VERSION: "9.12.3"
  A11_IMPL_BASE_URL: ${{ vars.A11_IMPL_BASE_URL || 'http://127.0.0.1:8081' }}
  E2E_API_PORT: "8081"

jobs:
  release-gate:
    name: 11-12 entitlement + rate-limit 验收
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 记录代码锚点（commit sha；无 commit 引用的证据两周后无法回答「哪版」）
        run: |
          git rev-parse HEAD | tee commit-sha.txt
          echo "- commit: \`$(cat commit-sha.txt)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install --quiet pyyaml requests

      - name: 起真栈（docker compose；API 8081）
        run: |
          bash tests/e2e/scripts/up.sh
          curl -fsS "${A11_IMPL_BASE_URL}/healthz"

      - name: seed 审计事件与 hold（A11 需要可抽样数据）
        env:
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
          SEED_ENVIRONMENT: e2e
        run: |
          # 缺 DSN 时脚本 exit 2；按失败处理，不 skip。
          bash infra/db/seed-entitlement-audit.sh
      - name: 校验 deploy 事件 target_tier（gap 规则依赖；缺了按失败，不 skip）
        env:
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
        run: |
          set -euo pipefail
          bad=$(psql -X -At "$A11_AUDIT_DSN" -c "
            select count(*) from audit.entitlement_events e
            where e.event_type = 'deploy'
              and coalesce(e.new_value->>'target_tier','') not in ('internal_eval','c_end_display')")
          echo "deploy 事件缺/非法 target_tier 行数：$bad"
          if [ "$bad" != "0" ]; then
            echo "::error::deploy 事件必须写 new_value.target_tier（来自发布参数/审批记录）；缺失即 gap 规则失效"
            exit 1
          fi
          missing_switch=$(psql -X -At "$A11_AUDIT_DSN" -c "
            select count(*)
            from audit.entitlement_events d
            where d.event_type = 'deploy'
              and d.new_value->>'target_tier' <> 'internal_eval'
              and not exists (
                select 1 from audit.entitlement_events s
                where s.event_type = 'tier_switch' and s.deployment_uid = d.deployment_uid)")
          echo "非 internal_eval 但缺 tier_switch 的 deploy 行数：$missing_switch"
          if [ "$missing_switch" != "0" ]; then
            echo "::error::deploy 的 target_tier != internal_eval 时必须有同 deployment_uid 的 tier_switch"
            exit 1
          fi

      # ---- §7.1 Entitlement 桶（顺序即口径；任一非 0 即失败）----
      - name: §7.1-1 到期 fail-closed（expired）
        env:
          A11_EXPIRY_MODE: expired
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
        run: python3 tests/data/acceptance/check_entitlement_expiry.py

      - name: §7.1-2 启动拒绝（c_end_display 无 expires）
        env:
          A11_EXPIRY_MODE: unset
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
        run: python3 tests/data/acceptance/check_entitlement_expiry.py

      - name: §7.1-3 base-info 白名单（data ⊆ 7 字段，lot_size 出现即红）
        run: python3 tests/data/acceptance/check_base_info_whitelist.py

      - name: §7.1-4 hold stale → 403（control 不可达即拒）
        env:
          A11_HOLD_MODE: stale
          A11_HOLD_DSN: ${{ secrets.A11_HOLD_DSN }}
        run: python3 tests/data/acceptance/check_entitlement_hold.py

      - name: §7.1-4b hold unreachable → 403
        env:
          A11_HOLD_MODE: unreachable
          A11_HOLD_DSN: ${{ secrets.A11_HOLD_DSN }}
        run: python3 tests/data/acceptance/check_entitlement_hold.py

      - name: §7.1-4c /v1/* 无条件 no-store
        run: python3 tests/data/acceptance/check_no_store_all.py

      - name: §7.1-5 四原因对外文案一致（内部事件原因可区分见 #6）
        run: python3 tests/data/acceptance/check_entitlement_copy.py

      - name: §7.1-6 事件可回指 + 链一致 + append-only + event_key 幂等
        env:
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
        run: python3 tests/data/acceptance/check_entitlement_events.py

      - name: §7.1-7 前端无渲染绕开关（静态）
        run: python3 tests/data/acceptance/check_frontend_render_gate.py

      - name: §7.1-8 裸启动（bare：行情 403、tier=internal_eval）
        env:
          A11_EXPIRY_MODE: bare
        run: python3 tests/data/acceptance/check_entitlement_expiry.py

      # ---- §7.3 数据侧 display_safe fail-closed（A11 CI_MOUNT §7.3，不依赖 PG）----
      - name: §7.3 display_safe fail-closed（prod 拒绝 / dev 全 false / synthetic 忽略）
        run: python3 tests/data/acceptance/check_display_safe_failclosed.py

      # ---- §7.2 限流桶 ----
      - name: §7.2 限流（第 61 次 429 / Retry-After / XFF 不换桶 / 文案不露内部码）
        run: python3 tests/data/acceptance/check_rate_limit.py

      - name: 恢复 hold 对账时间（stale 只服务 #4；不能让 #4 之后的环境默认 fail-closed）
        if: always()
        env:
          A11_AUDIT_DSN: ${{ secrets.A11_AUDIT_DSN }}
        # 恢复失败 = 真失败：环境停在 stale 会让 A11 把「环境坏了」误判成「判定对了」。
        # 本地无 PG 的容错只放在本地脚本里，release gate 不降级。
        run: bash infra/db/seed-entitlement-audit.sh --restore-fresh

      - name: 证据包 manifest + tar（H5-R19）
        if: always()
        run: |
          node infra/ci/check-evidence-manifest.mjs
          mkdir -p evidence-dist
          node -e "const m=require('./infra/evidence/evidence-manifest.json'); console.log(m.artifacts.map(a=>a.path).join('\n'))" > /tmp/evidence-files.txt
          tar -czf "evidence-dist/evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" -T /tmp/evidence-files.txt
          node infra/ci/check-evidence-manifest.mjs --tarball evidence-dist/evidence-*.tar.gz

      - name: 汇总
        if: always()
        run: |
          {
            echo '## Release gate 结果'
            echo
            echo "- 镜像 tag: `${{ inputs.image_tag || github.ref_name }}`"
            echo "- 放行说明: ${{ inputs.reason || '（tag 触发）' }}"
            echo "- 口径: \`tests/contract/CI_MOUNT.md §7\`（退出码 2 = 缺配置，按失败处理）"
            echo "- e2e 真栈状态见 \`.e2e-status.json\` artifact"
            echo "- **④ 口径（L91 内网裁定）**：内网可达 + 公网不可达；详见 `docs/runbook/exposure-verification.md` 与 `infra/evidence/exposure-*.txt`"
            echo "- **NetworkPolicy：UNVERIFIED**（随 L91 无公网入口，真集群验证降级为历史项；责任人 H5，不计入 PASS）"
            if [ -z "${{ vars.PUBLIC_HOST }}" ]; then
              echo "- **公网不可达：UNVERIFIED**（未配置 vars.PUBLIC_HOST；ECS 侧证据见 exposure-internal）"
            else
              echo "- 公网不可达：见 probe 步骤（PUBLIC_HOST 业务端口必须无 HTTP 响应）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传证据（失败也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: |
            commit-sha.txt
            evidence-dist/*.tar.gz
            .e2e-status.json
            tests/e2e/.e2e-status.json
            tests/e2e/stack.log
          if-no-files-found: warn
          retention-days: 30

      - name: 公网不可达探针（L91；PUBLIC_HOST 业务端口必须无 HTTP 响应）
        if: vars.PUBLIC_HOST != ''
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          PUBLIC_PORTS: "80 8081 3000 18081"
          COMMIT: ${{ github.sha }}
        run: |
          set +e
          sh infra/evidence/tools/capture-exposure.sh --mode public > public-exposure.txt 2>&1
          rc=$?
          cat public-exposure.txt
          {
            echo "## 公网不可达 Probe（L91）"
            sed 's/^/    /' public-exposure.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::公网不可达探针失败（rc=${rc}）：存在可观测 HTTP 响应即视为暴露"
            exit 1
          fi
          cp public-exposure.txt "infra/evidence/exposure-public-$(date -u +%Y%m%dT%H%MZ).txt" || true

      - name: 公网不可达未验证（没有 vars.PUBLIC_HOST）
        if: vars.PUBLIC_HOST == ''
        run: |
          echo "::warning::无 vars.PUBLIC_HOST，公网不可达未实测；ECS 侧证据见 infra/evidence/exposure-internal-*.txt"
          echo "- ⚠️ 公网不可达：未验证（无 PUBLIC_HOST）" >> "$GITHUB_STEP_SUMMARY"

      - name: 收栈
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v || true
