openapi: 3.1.0

info:
  title: market-sense-h5 · market（行情域 P0）
  version: 0.4.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    P0 行情域契约（个股页竖切片，决策 #8）。域内含 instrument / quote / bars 三个资源，
    以及 B1 切片的两个确定性读模型：market-wide limit-ladder（涨跌停梯队）与 instrument 的 page-summary
    （个股页五段骨架/缺口卡）。后两者只组合已授权数据、不调用 LLM、不输出投资结论。
    来源与时效字段由 shared ResponseMeta 强制携带：source（含 as_of/staleness_ms）、data_entitlement；
    价格/序列类响应额外 required adjustment（复权口径）与 disclaimer（免责元数据）。
    数据口径：不做盘中实时（C2=A）；trade_date 为快照所属交易日，as_of 为数据市场时点。
    错误响应统一引用 shared Problem。

servers:
  - url: https://api.market-sense.invalid
    description: 占位域名（RFC 2606 .invalid），由 A13 在部署环境替换；路径含 /v1（决策 #1）

security: []  # 公开只读；数据授权与限流仍由服务端统一判定（决策 #5）

tags:
  - name: instrument
    description: 证券基础信息（P0 仅 A 股）
  - name: quote
    description: 最新行情快照
  - name: bars
    description: 历史 K 线（日线，含复权口径）
  - name: limit-ladder
    description: 收盘涨跌停梯队（B1-02 确定性派生，不含 AI）
  - name: page-summary
    description: 个股页五段骨架与数据缺口（B1-03 确定性聚合，不含 AI）

paths:

  /v1/instruments/{instrument_id}:
    get:
      operationId: getInstrument
      tags: [instrument]
      summary: 证券基础信息
      description: |
        返回单只证券的 canonical 基础信息。404 表示标识格式合法但不存在/未收录。
        基础信息不因数据授权缺失整体 403；响应 meta.entitlement 携带授权状态，
        仅供前端预判与降级展示，**不得替代**受授权约束接口（quote/bars/fundamental-summary）的 403。
        基础信息字段集与来源见 H4 基础信息白名单口径（2026-11-12）。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: 证券信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'
        default:
          $ref: '../shared/openapi.yaml#/components/responses/ProblemResponse'

  /v1/instruments/{instrument_id}/quote:
    get:
      operationId: getInstrumentQuote
      tags: [quote]
      summary: 最新行情快照
      description: |
        返回最近一次成功快照（C2=A：不做盘中实时）。停牌/尚未开盘时价格字段允许 null，禁止用 0 冒充。
        数据源不可用时按 A3 规则返回最近成功快照（as_of 为快照时点），staleness_ms 交由前端标注 stale。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: 行情快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '403':
          $ref: '../shared/openapi.yaml#/components/responses/EntitlementRestricted'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'
        default:
          $ref: '../shared/openapi.yaml#/components/responses/ProblemResponse'

  /v1/instruments/{instrument_id}/bars:
    get:
      operationId: listInstrumentBars
      tags: [bars]
      summary: 历史日线（按复权口径）
      description: |
        按时间升序返回日线。adjustment 缺省 none（不复权，H4 主口径）；
        响应 data.adjustment 与 meta.adjustment 回显实际生效口径，用于前端标注与契约测试断言。
        区间边界：from/to 含端点；to 缺省为最近交易日。停牌日不合成 K 线（无 bar），不得用 0 填充。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
        - name: adjustment
          in: query
          required: false
          description: 复权口径；缺省 none（不复权）。
          schema:
            $ref: '../shared/openapi.yaml#/components/schemas/AdjType'
            default: none
        - name: from
          in: query
          required: false
          description: 起始交易日（含），格式 YYYY-MM-DD。
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: 结束交易日（含），格式 YYYY-MM-DD；缺省为最近交易日。
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: 返回条数上限（1–500），默认 120。数据不足时按实际返回，has_more 指示是否还有更早数据。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 120
      responses:
        '200':
          description: 日线序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarsResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '403':
          $ref: '../shared/openapi.yaml#/components/responses/EntitlementRestricted'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'
        default:
          $ref: '../shared/openapi.yaml#/components/responses/ProblemResponse'

  /v1/market/limit-ladder:
    get:
      operationId: getLimitLadder
      tags: [limit-ladder]
      summary: 收盘涨跌停梯队（B1-02 临时口径）
      description: |
        B1-02 切片：按 board 规则从日线推导涨停/跌停梯队，供盘后复盘数据卡使用。
        本接口是确定性派生结果，不调用 LLM、不含投资结论。

        口径（P0 临时，H4 未签精确跌停价前）：
        - rule.name=provisional_board_pct，rule.version 标明规则版本；st_handling=excluded 表示
          ST/*ST 一律不参与梯队判定，列入 excluded_st，避免用错误的 5% 口径制造假涨停。
        - rule.price_basis=none 表示用不复权收盘价判定；响应 meta.adjustment 恒为 none。
        - board_pct 为主板/创业板/科创板/北交所/ST 的涨跌幅上限（百分数数值）。
        - 连板数（consecutive_boards）在 lookback 窗口内按连续涨停/跌停交易日计算；
          缺数据时不得猜连板，宁可少报。
        - trade_date 缺省为库内最新交易日；该日无数据时返回 200 + 空列表 + gaps，不返回 404。
        - 精确涨跌停价、全市场涨跌家数聚合待第 2 批（stk_limit / DWS），当前用 gaps 显式标注缺口。
      parameters:
        - name: trade_date
          in: query
          required: false
          description: 交易日 YYYY-MM-DD；缺省为库内最新交易日。
          schema:
            type: string
            format: date
        - name: lookback
          in: query
          required: false
          description: 连板回溯窗口（交易日数，1–10），默认 10。
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10
      responses:
        '200':
          description: 涨跌停梯队（可能为空列表）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitLadderResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../shared/openapi.yaml#/components/responses/EntitlementRestricted'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'
        default:
          $ref: '../shared/openapi.yaml#/components/responses/ProblemResponse'

  /v1/instruments/{instrument_id}/page-summary:
    get:
      operationId: getInstrumentPageSummary
      tags: [page-summary]
      summary: 个股页五段骨架与数据缺口（B1-03）
      description: |
        B1-03 切片：返回个股页 quote/fundamental/valuation/capital/risk 五段的可用性骨架，
        供 UI 在数据未接入时显式展示缺口，而不是编造数值或空白页。
        本接口只组合已授权模块的确定性摘要，不调用 LLM、不含投资结论。

        语义：
        - instrument 不存在/未收录 → 404 INSTRUMENT_NOT_FOUND；存在但某段无数据 → 200，
          该段 availability=gap/pending 并给 reason/gaps。
        - availability=restricted 的段不得携带任何数值或 summary（授权降级语义同 quote/bars 的 403）。
        - 只覆盖已接入的标的与数据集；fundamental 当前仅少量标的，不得在全市场范围伪装 available。
        - 五段固定为 quote、fundamental、valuation、capital、risk，各出现一次；valuation 依赖
          daily_basic、capital 依赖 moneyflow、risk 依赖质押/解禁/股东户数，当前均按 gap/pending 返回。
        - 部分受限时仍返回 200，对应段 availability=restricted；整体 403 仅保留给「当前 tier 对
          本页所有数据均无权展示」的页面级阻断，由服务端统一判定，不得用 403 隐藏标的本身。
      parameters:
        - $ref: '../shared/openapi.yaml#/components/parameters/InstrumentIdPath'
      responses:
        '200':
          description: 个股页五段骨架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentPageSummaryResponse'
        '400':
          $ref: '../shared/openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../shared/openapi.yaml#/components/responses/NotFound'
        '403':
          $ref: '../shared/openapi.yaml#/components/responses/EntitlementRestricted'
        '429':
          $ref: '../shared/openapi.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/openapi.yaml#/components/responses/InternalError'
        default:
          $ref: '../shared/openapi.yaml#/components/responses/ProblemResponse'

components:
  schemas:

    Instrument:
      type: object
      description: 证券 canonical 基础信息（P0 仅 A 股）。
      required: [instrument_id, exchange, name, board, security_type, list_status]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        exchange:
          type: string
          enum: [SSE, SZSE, BSE]
          description: 交易所代码；新增交易所属破坏性变更（枚举加值），须 H2 签字。
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 证券简称。
        board:
          type: string
          enum: [main, gem, star, bse]
          description: 板块：main 主板 / gem 创业板 / star 科创板 / bse 北交所。H4 涨跌停与涨跌幅按板块规则计算。
        security_type:
          type: string
          enum: [stock, etf, index]
          description: 证券类型；P0 仅支持 stock，etf/index 为后续扩展预留（枚举加值属破坏性变更）。
        list_status:
          type: string
          enum: [listed, delisted, pre_listed]
          description: 上市状态。退市证券保留记录（不得删除），list_status=delisted。
        listed_at:
          type: string
          format: date
          description: 上市日期（如可得）。

    InstrumentResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Instrument'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          description: 强制携带 source（含 as_of/staleness_ms）与 data_entitlement；基础信息无复权口径。

    Quote:
      type: object
      description: |
        最新行情快照（C2=A：不做盘中实时）。价格单位：元；成交量：股；成交额：元。
        停牌/尚未开盘时 last_price、change、change_pct 允许 null，禁止用 0 冒充。
      required: [instrument_id, trade_date, last_price, prev_close, change, change_pct, volume, amount, suspended]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        trade_date:
          type: string
          format: date
          description: 快照所属交易日（A 股交易日，非自然日）。
        last_price:
          type: [number, "null"]
          description: 最新价（元），两位小数；无成交/停牌为 null。
        prev_close:
          type: [number, "null"]
          description: 前收盘价（元）。
        change:
          type: [number, "null"]
          description: 涨跌额（元），= last_price − prev_close；null 语义同 last_price。
        change_pct:
          type: [number, "null"]
          description: 涨跌幅（百分数数值，1.23 表示 +1.23%）；按板块规则计算（H4 D6）。
        open:
          type: [number, "null"]
          description: 开盘价（元）。
        high:
          type: [number, "null"]
          description: 最高价（元）。
        low:
          type: [number, "null"]
          description: 最低价（元）。
        volume:
          type: integer
          format: int64
          minimum: 0
          description: 成交量（股）。
        amount:
          type: number
          minimum: 0
          description: 成交额（元）。
        suspended:
          type: boolean
          description: 是否停牌。
        limit_status:
          type: string
          enum: [none, limit_up, limit_down]
          description: 涨跌停状态（按板块规则判定）；未知/不适用为 none。

    QuoteResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Quote'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [adjustment, disclaimer]
          description: |
            adjustment 为价格口径（快照不复权，恒为 none）；
            disclaimer 为免责元数据（H6 不可配、closable 恒 false）。

    Bar:
      type: object
      description: 单日 K 线（价格已按请求口径复权，单位：元；成交量：股；成交额：元）。
      required: [trade_date, open, high, low, close, volume, amount]
      additionalProperties: false
      properties:
        trade_date:
          type: string
          format: date
          description: 交易日。
        open:
          type: number
          description: 开盘价（元）。
        high:
          type: number
          description: 最高价（元）。
        low:
          type: number
          description: 最低价（元）。
        close:
          type: number
          description: 收盘价（元）。
        volume:
          type: integer
          format: int64
          minimum: 0
          description: 成交量（股）。
        amount:
          type: number
          minimum: 0
          description: 成交额（元）。

    BarsData:
      type: object
      required: [instrument_id, adjustment, bars, has_more]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        adjustment:
          $ref: '../shared/openapi.yaml#/components/schemas/AdjType'
        bars:
          type: array
          items:
            $ref: '#/components/schemas/Bar'
        has_more:
          type: boolean
          description: 是否还有更早的数据（limit 截断时 true）。

    BarsResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/BarsData'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [adjustment, disclaimer]
          description: adjustment 必须与 data.adjustment 一致（契约测试 A11 断言）。

    Gap:
      type: object
      description: |
        数据/能力缺口（显式缺口，不得用 0 或空串伪装）。已知 P0 值：
        STK_LIMIT_PRECISE_PENDING、MARKET_BREADTH_PENDING（limit-ladder）；
        DAILY_BASIC_MISSING、MONEYFLOW_MISSING、RISK_DATASETS_MISSING、INDEX_BENCHMARK_MISSING（page-summary）。
        新增缺口码是 additive 的字符串取值，不视为枚举破坏；客户端应按 code 做展示映射并保留未知码兜底。
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: 缺口码（大写下划线）；未知码不得导致页面崩溃。
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: 面向用户的中性说明，不得包含供数方名称、内部 tier 或模型名。

    LimitLadderRule:
      type: object
      description: |
        涨跌停梯队规则（P0 临时口径）。H4 签署精确跌停价/ST 口径后由第 2 批 stk_limit 替换，
        届时新建 rule.version 并保留本字段以支持回放。
      required: [name, version, st_handling, price_basis, board_pct]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]+$'
          description: 规则名；P0 固定为 provisional_board_pct。
        version:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          description: 规则版本；规则变化必须升版本，不得静默改口径。
        st_handling:
          type: string
          enum: [excluded]
          description: ST 处理方式；P0 一律 excluded（不参与梯队，列入 excluded_st）。
        price_basis:
          type: string
          enum: [none]
          description: 价格口径；涨跌停判定必须用不复权价（none），与 meta.adjustment 一致。
        board_pct:
          type: object
          description: 各板块涨跌幅上限（百分数数值）。
          required: [main, gem, star, bse, st]
          additionalProperties: false
          properties:
            main:
              type: number
              description: 主板（10）。
            gem:
              type: number
              description: 创业板（20）。
            star:
              type: number
              description: 科创板（20）。
            bse:
              type: number
              description: 北交所（30）。
            st:
              type: number
              description: ST/*ST（5）；P0 仅用于文档完整性，ST 实际不参与梯队。
        note:
          type: string
          maxLength: 300
          description: 口径说明；不得包含投资结论或供数方名称。

    LimitLadderItem:
      type: object
      description: 梯队中的一只证券。
      required: [instrument_id, name, board, consecutive_boards, close, prev_close, change_pct]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        name:
          type: string
          minLength: 1
          maxLength: 64
        board:
          type: string
          enum: [main, gem, star, bse]
        consecutive_boards:
          type: integer
          minimum: 1
          description: 连续涨停/跌停交易日数；由 lookback 窗口内日线判定，缺数据不得猜。
        close:
          type: number
          description: 收盘价（元，不复权，两位小数）。
        prev_close:
          type: number
          description: 前收盘价（元，不复权）。
        change_pct:
          type: number
          description: 涨跌幅（百分数数值，1.23 表示 +1.23%）。

    LimitLadderData:
      type: object
      required: [trade_date, rule, limit_up, limit_down, excluded_st, gaps]
      additionalProperties: false
      properties:
        trade_date:
          type: string
          format: date
          description: 梯队所属交易日。
        rule:
          $ref: '#/components/schemas/LimitLadderRule'
        limit_up:
          type: array
          description: 涨停梯队；按 consecutive_boards 降序、instrument_id 升序。
          items:
            $ref: '#/components/schemas/LimitLadderItem'
        limit_down:
          type: array
          description: 跌停梯队；排序同 limit_up。
          items:
            $ref: '#/components/schemas/LimitLadderItem'
        excluded_st:
          type: array
          description: 因 ST 口径不参与梯队的证券（只给标识与名称，不伪装成涨跌停）。
          items:
            type: object
            required: [instrument_id, name]
            additionalProperties: false
            properties:
              instrument_id:
                $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
              name:
                type: string
                minLength: 1
                maxLength: 64
        gaps:
          type: array
          description: 本轮能力/数据缺口；无缺口时为空数组。
          items:
            $ref: '#/components/schemas/Gap'

    LimitLadderResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/LimitLadderData'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [adjustment, disclaimer]
          description: |
            source=platform_eod；adjustment 必须为 none（与 rule.price_basis 一致）；
            disclaimer 为价格类数据的免责元数据（closable 恒 false）。

    PageSummaryRef:
      type: object
      description: 某一段引用的数据模块与时点，用于前端「来源可下钻」。
      required: [module]
      additionalProperties: false
      properties:
        module:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: 数据模块（market/fundamental/research 等）；不出现内部服务名。
        as_of:
          type: string
          format: date-time
          description: 该模块数据的市场时点。
        period:
          type: string
          maxLength: 32
          description: 所属期间（如 2025Q3、2025-10）；不适用时省略。

    PageSummarySection:
      type: object
      description: |
        个股页的一段。availability=restricted 时不得携带数值、summary 或 data_refs；
        gap/pending 时必须给 reason，以便页面显式展示缺口。
      required: [id, availability]
      additionalProperties: false
      properties:
        id:
          type: string
          enum: [quote, fundamental, valuation, capital, risk]
          description: 五个固定段，各出现一次。
        availability:
          type: string
          enum: [available, gap, pending, restricted]
          description: |
            available=已接入且有数据；gap=已接入但当前标的无数据；
            pending=数据集尚未接入（第 2 批）；restricted=当前 entitlement 无权展示。
        reason:
          type: string
          maxLength: 200
          description: 面向用户的中性原因；restricted 时不得透露存在性/内部 tier。
        data_refs:
          type: array
          description: 该段实际引用到的数据模块；restricted 时为空。
          items:
            $ref: '#/components/schemas/PageSummaryRef'
        summary:
          type: string
          maxLength: 300
          description: |
            仅 available 段允许；只放已授权模块的小型确定性摘要，禁止 AI 生成文案或投资结论。
            无数据/受限时不得用空串或 0 占位。
        gaps:
          type: array
          description: 该段内部的数据缺口（可选，用于更细粒度说明）。
          items:
            $ref: '#/components/schemas/Gap'

    InstrumentPageSummaryData:
      type: object
      required: [instrument_id, sections, gaps]
      additionalProperties: false
      properties:
        instrument_id:
          $ref: '../shared/openapi.yaml#/components/schemas/InstrumentId'
        sections:
          type: array
          minItems: 5
          maxItems: 5
          uniqueItems: true
          description: 固定五段（quote/fundamental/valuation/capital/risk），每段恰好一次；顺序不承诺。
          items:
            $ref: '#/components/schemas/PageSummarySection'
        gaps:
          type: array
          description: 本轮全局能力缺口；无缺口时为空数组。
          items:
            $ref: '#/components/schemas/Gap'

    InstrumentPageSummaryResponse:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/InstrumentPageSummaryData'
        meta:
          allOf:
            - $ref: '../shared/openapi.yaml#/components/schemas/ResponseMeta'
          required: [disclaimer]
          description: source=platform_eod；页面含财务摘要，必须携带 disclaimer（closable 恒 false）。
