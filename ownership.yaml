notes:
  # CI path guard 默认策略：未匹配任何 entry 的路径一律拒绝写入（default-deny）；
  # 新增顶层目录必须同时在本文件登记，否则 CI 拒绝（A8 实现 guard 时按此语义）。
  unmatched_paths: deny

  # 与 roster.yaml write_scope 的差异 → 2026-11-04 已机械批准（本表写权即时生效）。
  # 2026-11-06 重建后：契约/API 网关 owner 归 H2，SRE 归 A8。
  pending_roster_amendments:
    - path: services/api/
      reason: 2026-11-04 机械批准 owner 由 A3 改为架构 owner（现归 H2）。
      proposed: H2 owner（reviewer H3：含 copy.ts 免责注入）。
    - path: packages/api-client/
      reason: 由 contracts/ 生成的 TS 客户端（决策 #1）；生成物禁止手改，架构 owner 只跑 codegen。
      proposed: H2 owner（reviewer H1），生成物不手改。
    - path: .github/workflows/
      reason: roster 中 SRE（A8）owns .github/workflows/。
      proposed: A8 owner，roster write_scope 已含 .github/workflows/。
    - path: docs/runbook/
      reason: roster 中 SRE（A8）owns docs/runbook/。
      proposed: A8 owner，H2 确认 runbook 目录位置后修订 roster。

  # 尚未创建的 P2/P3 写域（对应 agent 激活时由 L0 编排、H2 确认后补建并登记）。
  reserved_paths:
    - { path: services/workflow-adapter/, owner: A4 }
    # roster A4 写域含 services/approval/（2026-11-06 编制表），目录激活时补建。
    - { path: services/approval/, owner: A4, reviewers: [H2] }
    # rules/ 保持 A5；合规规则属政策文本，人审固定 H3。
    - { path: rules/, owner: A5, reviewers: [H3] }
    - { path: reviews/compliance/, owner: A11, reviewers: [H3] }
    # roster A11 登记的合规复核证据簿路径（交接文档 §6，append-only）；与 reviews/compliance/ 并存。
    - { path: reviews/compliance-policy-review/, owner: A11, reviewers: [H3] }
    - { path: crm/playbooks/, owner: A9 }
    - { path: security/, owner: H4 }
    - { path: auth/, owner: H4 }
    - { path: design/, owner: M1 }
    - { path: tests/personas/, owner: A7 }
    - { path: ops/dashboards/, owner: A8 }
    # 金融研究 agent（KD-ARCH-A20，2026-11-05）：按评估文档先登记 reserved_paths，
    # 目录激活期补建；正式登记后 reviewer 含 H3（研究产物合规终审）。
    - { path: research/quant/, owner: A10, reviewers: [H3] }
    - { path: research/macro/, owner: A11, reviewers: [H3] }
    - { path: research/fund/, owner: A10, reviewers: [H3] }
    - { path: research/intel/, owner: A11, reviewers: [H3] }
