# market-sense-h5 · 目录所有权表（P0 骨架 v0.1）
#
# 依据：agents/decisions.md #2（2026-11-03 已批准）
#       「单仓 pnpm workspace，按域分目录，ownership.yaml + CI path guard」
# 维护者：L0（编排与编制）；契约/目录结构口径由 H2 终审，本文件任何改动 reviewer 必须包含 H2。
#
# 字段语义（CI path guard 按此执行，脚本由 A8/SRE 落在 .github/workflows/）：
#   path      仓库相对路径前缀（末尾 / 表示目录）。匹配规则：最长前缀优先。
#   owner     唯一写者（single writer）。任何写操作的主体必须等于 owner。
#   reviewers 人审席位。仅允许 H1–H4（README §3：agent 永远不能批准 agent）。
#   forbidden 禁止写入的主体列表。"*" = 除 owner 外的所有主体（L0、M1、A1–A11 与 H1–H4）。
#             越界即触发 README §9 熔断：吊销身份 + 全量审计历史操作。
#
# 本文件只登记「已创建目录」。尚未激活的 P2/P3 写域见文件末尾 notes.reserved_paths。
#
# 2026-11-06 编制重建：旧 30 席 → 17 席，owner/reviewers 按
# docs/HANDOFF-team-rebuild-2026-11-06.md §2 重映射（旧 A0 职责归 H2、旧 H5 归 H4、
# 旧 H6 的人审按语义归 H1、旧 A6 的 CRM 后端归 A4、旧 A10 的设计归 M1）。

