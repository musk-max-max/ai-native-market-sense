# market-sense-h5 · 目录所有权表（P0 骨架 v0.1）
#
# 依据：agents/decisions.md #2（2026-11-03 已批准）
#       「单仓 pnpm workspace，按域分目录，ownership.yaml + CI path guard」
# 维护者：A0（仓库目录结构 owner）；本文件任何改动 reviewer 必须包含 H2。
#
# 字段语义（CI path guard 按此执行，脚本由 A13 落在 ci/）：
#   path      仓库相对路径前缀（末尾 / 表示目录）。匹配规则：最长前缀优先。
#   owner     唯一写者（single writer）。任何写操作的主体必须等于 owner。
#   reviewers 人审席位。仅允许 H1–H6（README §3：agent 永远不能批准 agent）。
#   forbidden 禁止写入的主体列表。"*" = 除 owner 外的所有主体（A0–A19 与 H1–H6）。
#             越界即触发 README §9 熔断：吊销身份 + 全量审计历史操作。
#
# 本文件只登记「已创建目录」。尚未激活的 P2/P3 写域见文件末尾 notes.reserved_paths。

