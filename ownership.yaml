notes:
  # CI path guard 默认策略：未匹配任何 entry 的路径一律拒绝写入（default-deny）；
  # 新增顶层目录必须同时在本文件登记，否则 CI 拒绝（A13 实现 guard 时按此语义）。
  unmatched_paths: deny

  # 与 roster.yaml write_scope 的差异 → Lead 2026-11-04 已机械批准（本表写权即时生效；
  # roster 文本按 Lead 指令待 H2 会签后修订，不阻塞骨架落地）。
  pending_roster_amendments:
    - path: services/api/
      reason: Lead 2026-11-04 机械批准 owner 由 A3 改为 A0（H2 会签后修订 roster）。roster 中 A0 write_scope 仅含 contracts/ 与 docs/，A3 仅含 services/market/ 与 services/content/。
      proposed: A0 owner（H2 reviewer 不变），H2 补 roster write_scope。
    - path: packages/api-client/
      reason: 由 contracts/ 生成的 TS 客户端（决策 #1）；生成物禁止手改。roster 中 A0 write_scope 仅含 contracts/ 与 docs/。
      proposed: A0 owner（只跑 codegen，不手改），H2 补 roster write_scope。
    - path: .github/workflows/
      reason: roster 中 A13 owns ci/；本骨架按 GitHub Actions 放置流水线。
      proposed: A13 owner，roster write_scope 增加 .github/workflows/ 或 ci/ 改挂载点。
    - path: docs/runbook/
      reason: roster 中 A13 owns ops/runbooks/；本骨架把 runbook 放 docs/runbook。
      proposed: A13 owner，H2 确认 runbook 目录位置后修订 roster。

  # 尚未创建的 P2/P3 写域（对应 agent 激活时由 A0 按 roster owns 补建并登记）。
  reserved_paths:
    - { path: services/workflow-adapter/, owner: A4 }
    - { path: rules/, owner: A5 }
    - { path: configs/ops/, owner: A14 }
    - { path: configs/rbac/, owner: A15 }
    - { path: approvals/, owner: A15 }
    - { path: reviews/compliance/, owner: A16 }
    - { path: crm/playbooks/, owner: A17 }
    - { path: security/, owner: A9 }
    - { path: auth/, owner: A9 }
    - { path: design/, owner: A10 }
    - { path: tests/personas/, owner: A18 }
    - { path: ops/dashboards/, owner: A13 }
    # 金融研究 agent（KD-ARCH-A20，2026-11-05）：按评估文档先登记 reserved_paths，
    # 目录由 A0 在激活期补建；正式登记后 reviewer 含 H3（研究产物合规终审）。
    - { path: research/quant/, owner: A20, reviewers: [H3] }
    - { path: research/macro/, owner: A21, reviewers: [H3] }
    - { path: research/fund/, owner: A22, reviewers: [H3] }
    - { path: research/intel/, owner: A23, reviewers: [H3] }
