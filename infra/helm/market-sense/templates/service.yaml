apiVersion: v1
kind: Service
metadata:
  name: {{ include "market-sense.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "market-sense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
