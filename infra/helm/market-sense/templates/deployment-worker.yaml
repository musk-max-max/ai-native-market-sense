apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "market-sense.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  revisionHistoryLimit: 5
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "market-sense.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "market-sense.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: {{ include "market-sense.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.image.worker.repository "tag" .Values.image.worker.tag "digest" .Values.image.worker.digest) }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command: ['node', 'dist/worker.js']
          envFrom:
            - configMapRef:
                name: {{ include "market-sense.configName" . }}
          env:
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.worker.persistence.enabled }}
            - name: audit-data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.worker.persistence.enabled }}
        - name: audit-data
          persistentVolumeClaim:
            claimName: {{ include "market-sense.fullname" . }}-worker-data
        {{- end }}
