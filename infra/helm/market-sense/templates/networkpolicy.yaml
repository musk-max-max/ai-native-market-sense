{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
# H5-R10：默认拒绝 + 仅放行业务必需。五条不变式（check-network-policy.mjs 断言）：
#   1) ingress 默认拒绝；2) 只放行 ingress-controller；3) egress 默认拒绝；
#   4) 放行 DNS；5) 放行监控抓取（以及显式声明的 DB/Redis/外部依赖）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "market-sense.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "market-sense.fullname" . }}-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "market-sense.fullname" . }}-allow-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "market-sense.fullname" . }}-default-deny-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "market-sense.fullname" . }}-allow-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "market-sense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "market-sense.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if $np.allowEgress.dns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dnsNamespace | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if $np.allowEgress.postgres }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if $np.allowEgress.redis }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- range $np.externalEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: {{ default "TCP" .protocol }}
          port: {{ .port }}
    {{- end }}
{{- end }}
