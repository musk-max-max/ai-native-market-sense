# preview 环境覆盖值：一个 PR 一套 namespace/release（由 CI 传入 prNumber）
# 限制：单副本、无 HPA、小配额；数据只用 fixture/mock，不连生产 tushare 凭据。
global:
  environment: preview
  imageRegistry: ghcr.io/market-sense-h5

image:
  api:
    tag: pr
  worker:
    tag: pr

api:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
ingress:
  enabled: true
  host: pr-0.preview.market-sense.invalid
  annotations:
    market-sense.io/preview: "true"

config:
  # 客户端源 IP 信任边界（A19 R4）：部署方必须按实际 ingress/代理网段收窄；空/宽网段/回环在渲染期拒绝。
  TRUST_PROXY: "10.0.0.0/24"
  APP_PROFILE: "prod"
  NODE_ENV: preview
  LOG_LEVEL: debug
  DATA_FRESHNESS_MAX_AGE_SECONDS: "900"
  RELEASE_GRAY_STAGE: "100"
  INGEST_FALLBACK: fixture
  # preview 默认受限档：fixture/mock 不是授权依据。
  ENTITLEMENT_TIER: "internal_eval"
  # 非生产兜底值；发布流水线会 --set 覆盖成真实 deployment uid。
  DEPLOYMENT_UID: "preview-local"
  ENTITLEMENT_EXPIRES_AT: ""

monitoring:
  serviceMonitor:
    enabled: false

podDisruptionBudget:
  enabled: false

autoscaling:
  enabled: false

preview:
  prNumber: 0

worker:
  replicaCount: 1
  persistence:
    size: 5Gi
