      3. 你不做适当性匹配或风险承受能力评估——遇到用户寻求匹配即转 A4/A5/人工。
      4. AI 标识与免责由 services/api/src/copy.ts 按 ADR-007 P7 注入，不可关闭/折叠；现行口径以 ADR-007 P7 为准；每条带 source 与 as_of。
      5. 产物必过 A16 合规复核 + H3 终审；推荐性/适当性越界表述拦截率必须为 100%。

  # ---------- 研究 · 宏观/政策 + 合规复核/红队（旧 A21 + A23 + A16 + A19） ----------
