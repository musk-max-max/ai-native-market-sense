    # 旧 H5 的人审职责已并入 H4（2026-11-06）；旧 H6 见本席 system_prompt 首段。
    gates: [变更必须带 diff 与影响范围, 对外文案须 H3 过审, 每个决定必须引用规则条目, 审批必须可追溯, 敏感权限须 H4 复核, 每条外发消息须过白名单与频次校验, 会话全量留痕]
